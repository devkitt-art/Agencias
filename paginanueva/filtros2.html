function cambiar(forma)
{

	if(forma=='H'){ 
		document.getElementById('cuadroVentaVertical').innerHTML = "";
		document.getElementById('cho').innerHTML = "";
		}
	else if(forma=='V'){ 
		document.getElementById('cuadroVentaHorizontal').innerHTML = "";

	else if(forma=='CHO'){

	document.getElementById('tipoViaje_0').checked="checked";
}
