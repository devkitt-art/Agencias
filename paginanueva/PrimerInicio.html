<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link href="../imagenes_AEJ_27022025/Estilos.css" rel="stylesheet" type="text/css" />
    <!--    -->
    <link rel="stylesheet" href="http://www.odm.com.mx/css/login_odm.css" />

    <title><!$MG_emp> Acceso a Agencias</title>
    <script src="../js/idiomaES.js" type="text/javascript"></script>
    <script src="../js/idiomaIN.js" type="text/javascript"></script>
    <script src="../js/cambioRollOver.js" type="text/javascript"></script>
    <script src="../js/validaciones.js" type="text/javascript"></script>
    <script src="../js/idioma.js" type="text/javascript"></script>
  </head>

  <script language="javascript">
    var idioma = "<!$MG_idioma>";

    if(idioma=='') {
      idioma='ES'
    }

    setIdioma(idioma);

    function SalirAgencias() {
      parent.location.href = "<!$MG_urlret>";
    }

    function preventBack() {
      window.history.forward();
    }
    setTimeout("preventBack()", 0);
    window.onunload = function () {
      null
    };
    function redirectLogin() {
      parent.location.href = '<!$MG_url>netScripts/request.aspx?APPNAME=Navegante&PRGNAME=AccesoEx&ARGUMENTS=-AAG';
    }

    function validacontrasena(){
      //Regex Password
      var regexPass = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\da-zA-Z]).{12,15}$/;

      var regexSpecialCharacter = /["`'\\¿¡¨]/;

      var cactual = `${document.getElementById("contraactual").value}`;
      var cnueva = `${document.getElementById("nvacon").value}`;
      var cconfirma = `${document.getElementById("confcontra").value}`;
      cactual.replace(/^\s*|\s*$/g,"");
      cnueva.replace(/^\s*|\s*$/g,"");
      cconfirma.replace(/^\s*|\s*$/g,"");

      if(regexSpecialCharacter.test(cnueva)){
        alert(
          isEnglish()
          ? `Special characters (', ", \`, \\, \u00bf, \u00a1, \u00a8), cannot be used`
          : `Los caracteres especiales (', ", \`, \\, \u00bf, \u00a1, \u00a8), no pueden ser utilizados`
        );
        return false;
      }

      if(cactual=="" || cnueva=="") {
        alert(
          isEnglish()
          ? "The password cannot be empty"
          : "La contrasenia no puede quedar vacia"
        );
        return false;
      }

      if(cactual == cnueva) {
        alert(
          isEnglish()
          ? "The password cannot be the same"
          : "La contrasenia no puede ser la misma");
        return false;
      }

      if(!regexPass.test(cnueva)) {
        alert(
          isEnglish()
          ? 'Remember that for safety\n\t*The password must be greater than or equal to 12 characters and less than 15 characters\n\t*must contain upper and lower case letters\n\t*Must contain numbers\n\t*Must contain special characters'
          : 'Recuerda que por seguridad\n\t*La contrase\u00f1a debe de ser mayor o igual a 12 caracteres y menor a 15 caracteres\n\t*Debe de contener mayusculas y minusculas\n\t*Debe de contener numeros\n\t*Debe contener caracteres especiales')
        return false;
      }

      if(cnueva!=cconfirma) {
        alert(
          isEnglish()
          ? "Failed to confirm password"
          : "Error al confirmar la contrase\u00f1a" );
        return false;
      }

      var http = CreateRequest();
      var url = `/netScripts/Request.aspx?APPNAME=NAVEGANTE&PRGNAME=contrasena&ARGUMENTS=-A${window.btoa(cactual)},-A${window.btoa(cnueva)},-A${<!$MG_sesion>},A`+idioma;
      http.open("GET", url, true);
      http.onreadystatechange  = function() {
        if(http.readyState <= 3) {
          document.getElementById("tabla_resultados").innerHTML = "<center><img src='../imagenes_AEJ_27022025/loading.gif' align='center' /></center>";
        }
        if(http.readyState == 4 && http.status == 200) {
          try {
            var json_data = http.responseText;
            var object_contrasena = eval(json_data);
            document.getElementById("tabla_resultados").innerHTML = 
            '<div class="col-md-12"><div class="header_process right"><ul class="trip_cost_date"><li class="trip">'+txt.CambiarContrasena+'</li></div>'+
            '<div class="contenido">'+
              '<table width="95%" border="0" align="center" cellpadding="0" cellspacing="0" class="forma">'+
                '<tr><td><img width="680" height="15" style="margin-top:5px;" alt="" src="../imagenes_AEJ_27022025/separador_200.png"></td></tr>'+
                '<tr>'+
                  '<td class="recuadroBlanco">' +
                    '<table width="640" border="0" align="center" cellpadding="0" cellspacing="0" class="formulario">'+
                      '<tr>'+
                        '<td width="8%" align="right"></td>'+
                        '<td width="3%">&nbsp;</td>'+
                        '<td width="27%" class="color7"><strong>'+txt.Aviso+'</strong></td>'+
                        '<td width="31%" class="color3"><label for="textfield"></label></td>'+
                        '<td align="center"><label for="radio"></label></td>'+
                      '</tr>'+
                      '<tr>'+
                        '<td align="right">&nbsp;</td>'+
                        '<td>&nbsp;</td>'+
                        '<td colspan="3" class="color2">'+ object_contrasena.Estado +'</td>'+
                      '</tr>'+
                    '</table>'+
                  '</td>'+
                '</tr>'+
                '<tr>'+
                  '<td>&nbsp;</td>'+
                '</tr>'+
              '</table>'+
            '</div>';

            document.getElementById("continuar").innerHTML = '';
            document.getElementById("regresar").innerHTML = "<a href='#' onClick='return contrasena();' class='btn_ctr'>\u02c2\u02c2 "+txt.Regresar+"</a>";

          }
          catch(e) {
            console.log(e);
            
          }
        }
      }
      http.send(null);
    }

    function isEnglish() {
      return idioma == "IN";
    }
  </script>

  <body onload="MM_preloadImages('../imagenes_AEJ_27022025/btn_continuar_over.jpg','../imagenes_AEJ_27022025/btn_regresar_over.jpg')">
    <div id="contenedor_principal">
      <div id="header"><a href="#" target="_blank"></a></div>
      <div id="contenedor_derecho" style="margin-left: 115px">
        <div id="contenedor_resultados">
          <div id="banners_titulos">
            <span style="text-align: center; color: #ffffff" id="titulo_banner"></span>
          </div>
          <div id="tabla_resultados">
            <table  width="680" border="0" cellspacing="0" cellpadding="0" class="gris_medio">
              <tr class="azul_1">
                <td colspan="2">
                  <img
                    src="../imagenes_AEJ_27022025/separador_200.png"
                    alt=""
                    width="680"
                    height="15"
                    style="margin-top: 5px"
                  />
                </td>
              </tr>
              <tr>
                <td align="right" style="color: #ffffff">
                  <p id="catitle">:</p>
                </td>
                <td align="left">
                  <input id="contraactual" type="password" id="textfield" size="26" />
                </td>
              </tr>
              <tr>
                <td align="right" style="color: #ffffff">
                  <p id="cntitle"></p>
                </td>
                <td align="left">
                  <input id="nvacon" type="password" id="textfield" size="26" />
                </td>
              </tr>
              <tr>
                <td align="right" style="color: #ffffff">
                  <p id="cctitle"></p>
                </td>
                <td align="left">
                  <input id="confcontra" type="password" id="textfield" size="26" />
                </td>
              </tr>
              <tr>
                <td height="40" colspan="2">&nbsp;</td>
              </tr>
            </table>
          </div>
        </div>
        <div id="botones_abajo">
          <input
            type="button"
            onClick="return SalirAgencias();"
            name="Regresar"
            id="Regresar"
            value="Regresar"
          />
          <input
            type="button"
            onClick="return validacontrasena();"
            name="Continuar"
            id="Continuar"
            value="Continuar"
          />
        </div>
      </div>
    </div>
  </body>

  <script type="text/javascript">
    var mensaje = isEnglish() ? "HI <!$MG_usuar>, FOR YOUR SECURITY YOU HAVE TO CHANGE TOY CURRENT PASSWORD" : "HOLA <!$MG_usuar> POR SEGURIDAD TIENES QUE CAMBIAR TU CONTRASE\u00d1A POR UNA NUEVA"
    document.getElementById('titulo_banner').innerText= mensaje;

    document.getElementById('catitle').innerText = isEnglish() ? "CURRENT PASSWORD:" : "CONTRASE\u00d1A ACTUAL:";
    document.getElementById('cntitle').innerText= isEnglish() ? "NEW PASSWORD:" : "CONTRASE\u00d1A NUEVA:";
    document.getElementById('cctitle').innerText= isEnglish() ? "CONFIRM PASSWORD:" : "CONFIRMAR CONTRASE\u00d1A:";
  </script>
</html>
